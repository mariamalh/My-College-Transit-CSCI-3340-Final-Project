<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | My College Transit</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #003366;
            color: white;
            padding: 18px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #003366;
            text-align: center;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        form input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        .helptext {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 13px;
        }

        ul {
            color: #b00020;
            padding-left: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #0077cc;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}">🚌 My College Transit</a>
</nav>

<div class="container">
    <h1>Create an Account</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p class="login-link">
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>
    </p>
</div>

</body>
</html>
