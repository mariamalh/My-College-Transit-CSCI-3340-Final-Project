{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | My College Transit</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #002855;
            padding: 14px 28px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
            padding: 3px;
        }

        .site-name {
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #002855;
            text-align: center;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        form input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        .helptext {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 13px;
        }

        ul {
            color: #b00020;
            padding-left: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #f15a24;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #d9480f;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #002855;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo-area">
        <img
            src="{% static 'testApp/images/mct-logo.png' %}"
            alt="My College Transit logo"
            class="nav-logo"
        >

        <a href="{% url 'home' %}" class="site-name">
            My College Transit
        </a>
    </div>
</nav>

<div class="container">
    <h1>Create an Account</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Register
        </button>
    </form>

    <p class="login-link">
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>
    </p>
</div>

</body>
</html>
