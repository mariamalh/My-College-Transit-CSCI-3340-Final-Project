<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | My College Transit</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
        }

        nav {
            background: #003366;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #003366;
            margin-bottom: 10px;
        }

        .welcome {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .profile-card {
            background: #eef5fb;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .profile-card p {
            margin: 10px 0;
            font-size: 17px;
        }

        .logout-button {
            display: inline-block;
            padding: 12px 24px;
            background: #c62828;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #9f1f1f;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}">🚌 My College Transit</a>
    <a href="{% url 'home' %}">Home</a>
</nav>

<div class="container">
    <h1>User Profile</h1>

    <p class="welcome">
        Welcome, {{ user.username }}!
    </p>

    <div class="profile-card">
        <p><strong>Username:</strong> {{ user.username }}</p>
        <p><strong>Email:</strong> {{ user.email|default:"No email added" }}</p>
        <p><strong>Account created:</strong> {{ user.date_joined }}</p>
    </div>

    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout-button">Log Out</button>
    </form>
</div>

</body>
</html>
