{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | My College Transit</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #1f2933;
        }

        nav {
            background: #002855;
            color: white;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
            padding: 3px;
        }

        .site-name {
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #f15a24;
        }

        .nav-button {
            background: transparent;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .nav-button:hover {
            color: #f15a24;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #002855;
            margin-bottom: 10px;
        }

        .welcome {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .profile-card {
            background: #eef5fb;
            padding: 25px;
            border-left: 5px solid #f15a24;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .profile-card p {
            margin: 12px 0;
            font-size: 17px;
        }

        .logout-button {
            padding: 12px 24px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #9f1f1f;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                gap: 16px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo-area">
        <img
            src="{% static 'testApp/images/mct-logo.png' %}"
            alt="My College Transit logo"
            class="nav-logo"
        >

        <a href="{% url 'home' %}" class="site-name">
            My College Transit
        </a>
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'profile' %}">Profile</a>

        <form action="{% url 'logout' %}" method="POST">
            {% csrf_token %}
            <button type="submit" class="nav-button">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container">
    <h1>User Profile</h1>

    <p class="welcome">
        Welcome, {{ user.username }}!
    </p>

    <div class="profile-card">
        <p>
            <strong>Username:</strong>
            {{ user.username }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ user.email|default:"No email added" }}
        </p>

        <p>
            <strong>Account created:</strong>
            {{ user.date_joined }}
        </p>
    </div>

    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout-button">
            Log Out
        </button>
    </form>
</div>

</body>
</html>
